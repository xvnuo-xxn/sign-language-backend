<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手语学习平台 - 管理员登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px;
      width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo h1 { font-size: 24px; color: #333; margin-top: 12px; }
    .logo p { color: #888; font-size: 14px; margin-top: 4px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 14px; color: #555; margin-bottom: 8px; font-weight: 500; }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #667eea; }
    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .error { color: #e53e3e; font-size: 14px; text-align: center; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div style="font-size:48px">🤟</div>
      <h1>手语学习平台</h1>
      <p>管理员控制台</p>
    </div>
    <div class="form-group">
      <label>账号</label>
      <input type="text" id="account" placeholder="请输入账号" value="admin">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="pwd" placeholder="请输入密码" value="123456">
    </div>
    <button class="btn" onclick="login()">登 录</button>
    <div class="error" id="error">账号或密码错误</div>
  </div>

  <script>
    async function login() {
      const account = document.getElementById('account').value;
      const pwd = document.getElementById('pwd').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ account, pwd })
      });
      const data = await res.json();
      if (data.code === 200) {
        localStorage.setItem('isLogin', '1');
        location.href = '/admin.html';
      } else {
        document.getElementById('error').style.display = 'block';
      }
    }
    document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  </script>
</body>
</html>
